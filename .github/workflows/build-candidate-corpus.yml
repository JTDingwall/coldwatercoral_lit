name: Build candidate corpus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - step_4/build_candidate_corpus.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate corpus
        run: python step_4/build_candidate_corpus.py
      - name: Commit generated corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add step_4/corpus/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Generate merged candidate corpus"
          git push
