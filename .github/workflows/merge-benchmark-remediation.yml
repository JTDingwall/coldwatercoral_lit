name: Merge benchmark remediation

on:
  push:
    paths:
      - step_4/benchmark_recovery/remediation_candidate.csv
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: step-4-benchmark-remediation
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild candidate corpus
        run: python step_4/build_candidate_corpus.py
      - name: Rerun benchmark recovery check
        run: python step_4/check_benchmark_recovery.py
      - name: Commit reconciled outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add step_4/corpus step_4/benchmark_recovery
          git diff --cached --quiet && exit 0
          git commit -m "Reconcile benchmark remediation with candidate corpus"
          git push
